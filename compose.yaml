services:
  opensearch:
    image: opensearchproject/opensearch:latest  # pin an exact version once you pick one
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"   # localhost only, for testing
    networks:
      - analysis

  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
    ports:
      - "127.0.0.1:5601:5601"   # reach it via SSH tunnel/VPN, not the internet
    depends_on:
      - opensearch
    networks:
      - analysis
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./parser-cowrie.conf:/fluent-bit/etc/parsers-cowrie.conf
      - cowrie-logs:/logs/cowrie:ro
    depends_on:
      - opensearch
    networks:
      - analysis
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    environment:
      - COWRIE_PASSWORD=${COWRIE_PASSWORD}
    volumes:
      - ./cowrie.cfg:/cowrie/etc/cowrie.cfg
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    ports:
      - "2222:2222"  # SSH honeypot
      - "2223:2223"  # Telnet honeypot
    networks:
      - analysis
volumes:
  opensearch-data:
  cowrie-logs:
networks:
  analysis: