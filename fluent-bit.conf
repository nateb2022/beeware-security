[SERVICE]
    Flush        5
    Log_Level    info
    parsers_file parsers.conf
    parsers_file parser-cowrie.conf

# Test input: Read cowrie logs from the mounted volume and parse them using the cowrie_json parser
[INPUT]
    Name   tail
    Path   /cowrie/log/cowrie.json
    Tag    honeypot.cowrie
    Parser cowrie_json
    read_from_head true
    refresh_interval 5

