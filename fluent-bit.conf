[SERVICE]
    Flush        5
    Log_Level    info

# Test input: generates a fake event every second
[INPUT]
    Name   dummy
    Tag    test.event
    Dummy  {"message":"hello from fluent-bit","src_ip":"203.0.113.5"}

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    HTTP_User           admin
    HTTP_Passwd         ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    tls                 On
    tls.verify          Off
    Suppress_Type_Name  On
    Logstash_Format     On
    Logstash_Prefix     honeypot
